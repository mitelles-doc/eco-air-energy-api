name: CI-CD EcoAir API

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore EcoAir.EnergyApi.csproj

      - name: Compilar projeto
        run: dotnet build EcoAir.EnergyApi.csproj --configuration Release --no-restore

      - name: Rodar testes
        run: dotnet test --configuration Release --no-build
  docker-build:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t ecoair-api .

  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker-build
    environment:
      name: staging

    steps:
      - name: Simular deploy em staging
        run: echo "Deploy realizado no ambiente STAGING"

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production

    steps:
      - name: Simular deploy em produção
        run: echo "Deploy realizado no ambiente PRODUCTION"